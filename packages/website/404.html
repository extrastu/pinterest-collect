<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>页面不存在 · Pinterest 收藏</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; padding: 40px 0; }
    .notfound-card { max-width: 34rem; text-align: center; }
    .notfound h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 12px; }
    .notfound p { color: var(--muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <main class="notfound wrap">
    <div class="notfound-card">
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span>404</p>
      <h1>这个页面不存在</h1>
      <p>链接可能已经过期。回到首页看看插件功能、安装步骤和常见问题。</p>
      <a class="btn btn-primary" href="/">返回首页</a>
    </div>
  </main>
</body>
</html>
